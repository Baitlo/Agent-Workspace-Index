name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-22.04
            full_test: true
          - arch: aarch64
            runner: ubuntu-22.04-arm
            full_test: false

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install native build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake pkg-config

      - name: Install Rust
        run: |
          rustup set auto-self-update disable
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component clippy,rustfmt
          rustup default "$toolchain"

      - name: Verify native architecture
        run: |
          rustc -vV
          uname -m
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.arch }}-unknown-linux-gnu"

      - name: Check formatting
        run: cargo fmt --check

      - name: Lint
        if: matrix.full_test
        run: cargo clippy --locked --all-targets --all-features -- -D warnings

      - name: Test Rust
        if: matrix.full_test
        run: cargo test --locked --all-features

      - name: Build native arm64 release
        if: ${{ !matrix.full_test }}
        run: cargo build --locked --release

      - name: Smoke native arm64 binary
        if: ${{ !matrix.full_test }}
        run: |
          target/release/awi --version
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/workspace"
          printf 'pub fn arm64_native_smoke() {}\n' > "$fixture/workspace/lib.rs"
          target/release/awi --index-dir "$fixture/index" \
            reconcile "$fixture/workspace" --json
          target/release/awi --index-dir "$fixture/index" \
            search arm64_native_smoke --json | grep -q 'lib.rs'

      - name: Test Python helpers
        run: |
          python3 -m unittest tests/test_semantic_sidecar.py
          python3 tests/test_audit_session_adoption.py

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            runner: macos-15
          - arch: x86_64
            runner: macos-15-intel

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          rustup set auto-self-update disable
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component clippy,rustfmt
          rustup default "$toolchain"

      - name: Verify native architecture
        run: |
          rustc -vV
          uname -m
          test "$(rustc -vV | sed -n 's/^host: //p')" = "${{ matrix.arch }}-apple-darwin"

      - name: Build native release
        run: cargo build --locked --release

      - name: Smoke native binary
        run: |
          target/release/awi --version
          fixture="$(mktemp -d)"
          trap 'rm -rf "$fixture"' EXIT
          mkdir -p "$fixture/workspace"
          printf 'pub fn macos_native_smoke() {}\n' > "$fixture/workspace/lib.rs"
          target/release/awi --index-dir "$fixture/index" \
            reconcile "$fixture/workspace" --json
          target/release/awi --index-dir "$fixture/index" \
            search macos_native_smoke --json | grep -q 'lib.rs'

      - name: Test Python helpers
        run: |
          python3 -m unittest tests/test_semantic_sidecar.py
          python3 tests/test_audit_session_adoption.py
