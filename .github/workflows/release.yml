name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            full_test: true
          - runner: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            full_test: false
          - runner: macos-15
            target: aarch64-apple-darwin
            full_test: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            full_test: false

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Install native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes build-essential cmake pkg-config

      - name: Install Rust
        run: |
          rustup set auto-self-update disable
          toolchain="$(sed -n 's/^channel = "\(.*\)"$/\1/p' rust-toolchain.toml)"
          rustup toolchain install "$toolchain" --profile minimal --component clippy,rustfmt
          rustup default "$toolchain"

      - name: Verify tag, version, and native architecture
        env:
          TARGET: ${{ matrix.target }}
        run: |
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          version="${GITHUB_REF_NAME#v}"
          package_version="$(cargo metadata --locked --no-deps --format-version 1 |
            python3 -c 'import json,sys; print(json.load(sys.stdin)["packages"][0]["version"])')"
          test "$version" = "$package_version"
          test "$(rustc -vV | sed -n 's/^host: //p')" = "$TARGET"

      - name: Test x86_64 release profile
        if: matrix.full_test
        run: |
          cargo fmt --check
          cargo test --locked --release --all-features

      - name: Test Python helpers
        run: |
          python3 -m unittest tests/test_semantic_sidecar.py
          python3 tests/test_audit_session_adoption.py

      - name: Build release binary
        run: cargo build --locked --release

      - name: Package
        env:
          TARGET: ${{ matrix.target }}
        run: |
          package="awi-${TARGET}"
          mkdir -p "$package"
          install -m 0755 target/release/awi "$package/awi"
          install -m 0755 scripts/install.sh "$package/install.sh"
          cp README.md LICENSE "$package/"
          strip "$package/awi"
          tar --create --gzip --file "awi-${TARGET}.tar.gz" "$package"
          file "$package/awi"
          "$package/awi" --version

      - name: Attest artifact
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: awi-${{ matrix.target }}.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: awi-${{ matrix.target }}
          path: awi-${{ matrix.target }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: awi-*
          merge-multiple: true

      - name: Create checksums
        run: sha256sum awi-*.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            awi-*.tar.gz SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "AWI $GITHUB_REF_NAME" \
            --generate-notes \
            --notes "Native Linux binaries for x86_64 and arm64, plus native macOS binaries for Apple Silicon and Intel. The release installer supports one-command workspace indexing, managed AGENTS.md instructions, and MCP client registration. Semantic retrieval remains optional and requires Python, LanceDB, llama-cpp-python, and a compatible GGUF model."
